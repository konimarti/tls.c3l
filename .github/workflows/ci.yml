name: CI
on:
  push:
    branches: [ master, ci_testing ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'C3 compiler version to use'
        required: false
        default: 'v0.8.6'

env:
  C3_VERSION: v0.8.6

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # a missing certificate or peer fails the tests instead of skipping them
      TLS_REQUIRE_PKI: "1"
      TLS_REQUIRE_PEERS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup C3
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$C3_VERSION}"
          mkdir -p /opt/c3
          wget -O /tmp/c3.tar.gz "https://github.com/c3lang/c3c/releases/download/${VERSION}/c3-linux.tar.gz"
          tar -xzf /tmp/c3.tar.gz -C /opt/c3 --strip-components=1
          echo "/opt/c3" >> "$GITHUB_PATH"

      # distribution packages cannot be pinned here: their versions go into the log instead
      - name: Install OpenSSL runtime and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl3 openssl python3
          openssl version
          python3 --version

      - name: Show the compiler
        run: c3c --version

      - name: Check that every OpenSSL symbol we bind exists
        run: sh tests/check-symbols.sh ossl.c3

      - name: Generate the test certificates
        run: bash tests/pki/make-pki.sh

      # includes version_matches_project_json
      - name: Run unit tests against real peers
        run: python3 -I tests/peer/run.py run -- c3c test

      - name: Build the tool
        run: c3c build tlsc

      - name: The tool reports the library version
        run: |
          expected="$(sed -n 's/^[[:space:]]*"version": "\(.*\)",\{0,1\}$/\1/p' project.json)"
          test "$(build/tlsc --version)" = "tlsc ${expected}"

      - name: Server against openssl s_client
        run: python3 -I tests/peer/run.py serve-test

      - name: Client tool against slow, dropping and silent servers
        run: python3 -I tests/peer/run.py client-test

      - name: Run unit tests with AddressSanitizer
        run: python3 -I tests/peer/run.py run -- c3c test --sanitize=address

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup C3
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$C3_VERSION}"
          mkdir -p /tmp/c3
          curl -fL -o /tmp/c3.zip "https://github.com/c3lang/c3c/releases/download/${VERSION}/c3-macos.zip"
          unzip -q /tmp/c3.zip -d /tmp/c3
          echo "$(dirname "$(find /tmp/c3 -name c3c -type f | head -1)")" >> "$GITHUB_PATH"

      # Homebrew's version cannot be pinned easily: it is printed so a failure can be matched to it
      - name: Install OpenSSL
        run: |
          brew install openssl@3
          /opt/homebrew/opt/openssl@3/bin/openssl version
          c3c --version

      - name: Point the project at Homebrew's OpenSSL
        run: |
          python3 - <<'PY'
          import json
          p = json.load(open("project.json"))
          p["link-args"] = ["-L/opt/homebrew/opt/openssl@3/lib", "-lssl", "-lcrypto", "-Wl,-rpath,/opt/homebrew/opt/openssl@3/lib"]
          json.dump(p, open("project.json", "w"), indent=2)
          PY

      # Homebrew's openssl command line (macOS ships LibreSSL's) makes the test certificates; the loopback tests then
      # run and a missing certificate fails them. The peer tests still skip here (no peer harness on this job yet).
      - name: Generate the test certificates
        run: |
          export PATH="/opt/homebrew/opt/openssl@3/bin:$PATH"
          openssl version
          bash tests/pki/make-pki.sh

      # includes version_matches_project_json
      # a step limit: a test that hangs ends this step with the log up to the stuck test, not the whole job as "cancelled"
      - name: Unit tests
        timeout-minutes: 10
        env:
          TLS_REQUIRE_PKI: "1"
        run: c3c test

      - name: Build the tool
        run: c3c build tlsc

      - name: The tool reports the library version
        run: |
          expected="$(python3 -c 'import json; print(json.load(open("project.json"))["version"])')"
          test "$(build/tlsc --version)" = "tlsc ${expected}"

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup C3
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:C3_VERSION }
          Invoke-WebRequest -Uri "https://github.com/c3lang/c3c/releases/download/$version/c3-windows.zip" -OutFile c3.zip
          Expand-Archive c3.zip -DestinationPath C:\c3
          $dir = (Get-ChildItem -Path C:\c3 -Recurse -Filter c3c.exe | Select-Object -First 1).DirectoryName
          echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # OpenSSL 3 from vcpkg, which is preinstalled on the runner: it builds from source, so nothing depends on a vendor
      # download (the chocolatey package fetches an installer from a site that answers 403/404 to the runner), and it
      # installs the import libraries and the DLLs together. The version it built is printed.
      - name: Install OpenSSL
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg -or -not (Test-Path "$vcpkg\vcpkg.exe")) { throw "vcpkg not found on the runner" }
          & "$vcpkg\vcpkg.exe" install openssl:x64-windows --recurse
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          $root = "$vcpkg\installed\x64-windows"
          Get-ChildItem "$root\lib" -Filter "lib*.lib" | ForEach-Object { Write-Host "import library: $($_.FullName)" }
          Get-ChildItem "$root\bin" -Filter "lib*.dll" | ForEach-Object { Write-Host "dll: $($_.FullName)" }
          & "$vcpkg\vcpkg.exe" list openssl
          # the DLLs are found through PATH on this runner; applications should ship them next to the executable
          echo "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "OPENSSL_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # no headers are needed, only the import libraries of the OpenSSL install
      - name: Point the project at the OpenSSL import libraries
        shell: pwsh
        run: |
          $dir = "$env:OPENSSL_ROOT\lib"
          foreach ($f in "libssl.lib", "libcrypto.lib") { if (-not (Test-Path "$dir\$f")) { throw "$f not found in $dir" } }
          Write-Host "linking against $dir"
          $p = Get-Content project.json | ConvertFrom-Json
          $p | Add-Member -Force -NotePropertyName "linker-search-paths" -NotePropertyValue @($dir)
          $p | Add-Member -Force -NotePropertyName "linked-libraries" -NotePropertyValue @("libssl", "libcrypto")
          $p.PSObject.Properties.Remove("link-args")
          $p | ConvertTo-Json -Depth 10 | Set-Content project.json

      - name: Show the compiler
        run: c3c --version

      # includes version_matches_project_json; the peer and certificate tests skip on this job
      - name: Unit tests
        timeout-minutes: 10
        run: c3c test

      - name: Build the tool
        run: c3c build tlsc

      - name: The tool reports the library version
        run: |
          expected="$(python -c 'import json; print(json.load(open("project.json"))["version"])')"
          test "$(build/tlsc.exe --version | tr -d '\r')" = "tlsc ${expected}"
